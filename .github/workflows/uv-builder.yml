---
name: Python builder (uv)
run-name: Python builder (uv)

"on":
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on:
      - ubuntu-latest

    steps:
      - name: "Check out repository ${{ github.repository }}"
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          download-from-astral-mirror: "false" # dl directly from gh releases because astral mirror is not whitelisted

      - name: Lint
        run: uvx --from 'ruff==0.16.7' ruff check src

      - name: Build Python project
        run: uv build

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/


  publish:
    needs:
      - build

    runs-on:
      - ubuntu-latest

    steps:
      - name: "Check out repository ${{ github.repository }}"
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          download-from-astral-mirror: "false" # dl directly from gh releases because astral mirror is not whitelisted

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Fake publish Python package
        run: true
